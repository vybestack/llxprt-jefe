screen_schema = 2
id = "local.review"
title = "Review"
route = "review"
initial_focus = "pr-list"
focus_order = ["pr-list", "pr-detail"]

[[resources]]
type_id = "local.review.note"
schema_version = 1
semantic_key = "semantic-key"

[[resources.fields]]
id = "semantic-key"
label = "Semantic key"
type = "string"
required = true

[[panels]]

id = "pr-list"
type = "pr-list"
focusable = true
required = true

[[panels.ports]]
id = "selection"
direction = "output"
owner = "github.pull-requests"
type_id = "github.pull-request@1"
required = false
retained = false

[[panels]]
id = "pr-detail"
type = "pr-detail"
focusable = true
required = false

[[panels.ports]]
id = "subject"
direction = "input"
owner = "github.pull-requests"
type_id = "github.pull-request@1"
required = false
retained = true

[layout]
type = "split"
axis = "horizontal"

[[layout.children]]
min = 20
collapsible = false
size = { weight = 1 }
node = { type = "leaf", panel = "pr-list" }

[[layout.children]]
min = 20
collapsible = true
collapse_priority = 0
size = { weight = 1 }
node = { type = "leaf", panel = "pr-detail" }

[[relationships]]
kind = "master-detail"
source = "pr-list.selection"
target = "pr-detail.subject"
activation = "immediate"
empty = "retain"
