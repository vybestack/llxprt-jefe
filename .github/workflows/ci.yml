name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Flake baseline: main has had CI only since #439, so there is no history to
  # attribute intermittent failures against. A nightly run builds that record.
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: Format (rustfmt)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Check formatting
        run: cargo fmt --all --check

  lint:
    name: Lint (clippy)
    runs-on: ubuntu-latest
    env:
      CLIPPY_CONF_DIR: .github/clippy
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Run clippy (warnings as errors)
        run: rustup run stable cargo clippy --workspace --all-targets --all-features -- -D warnings

  clippy_allow_policy:
    name: Clippy allow policy
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Block untracked clippy allow attributes
        run: cargo xtask check clippy-allows

  source_file_size:
    name: Source file length checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Enforce source file length policy
        run: cargo xtask check source-size

  architecture_policy:
    name: Architecture boundary policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Enforce architecture boundary policy
        run: cargo xtask check architecture

  observation_coercion_policy:
    name: Uncertain-observation coercion policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Enforce uncertain-observation coercion policy
        run: cargo xtask check observation-coercion

  complexity:
    name: Complexity checks
    runs-on: ubuntu-latest
    env:
      CLIPPY_CONF_DIR: .github/clippy
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Enforce complexity limits
        run: |
          rustup run stable cargo clippy --workspace --all-targets --all-features -- \
            -A clippy::all \
            -A clippy::pedantic \
            -A clippy::nursery \
            -D clippy::cognitive_complexity \
            -D clippy::too_many_lines \
            -D clippy::too_many_arguments \
            -D clippy::type_complexity \
            -D clippy::struct_excessive_bools

  coverage:
    name: Coverage gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov
      - name: Enforce line coverage threshold
        run: cargo xtask coverage

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [fmt, lint, clippy_allow_policy, source_file_size, architecture_policy, complexity, coverage]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Check formatting
        run: cargo fmt --all --check
      - name: Build workspace
        run: cargo build --workspace --all-features --locked

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: [build]
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Run tests
        run: cargo test --workspace --all-features --locked

  tui_scenarios_linux:
    name: Required schema-1 TUI scenarios (Linux shard ${{ matrix.shard }})
    runs-on: ubuntu-latest
    needs: [build]
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install tmux
        run: sudo apt-get update && sudo apt-get install -y tmux
      - name: Build schema-1 scenario authority
        run: >-
          cargo build --locked --all-features
          --bin jefe --bin jefe-harness-probe --bin jefe-capture-shim
          --bin jefe-jsp-llxprt-fixture --bin tmux_scenario
      - name: Execute exact required Linux scenario shard
        run: |
          python3 scripts/run-scenario-manifest.py \
            --platform linux \
            --shard-index ${{ matrix.shard }} \
            --shard-count 2 \
            --tmux-scenario target/debug/tmux_scenario \
            --jefe target/debug/jefe \
            --probe target/debug/jefe-harness-probe \
            --jsp-fixture target/debug/jefe-jsp-llxprt-fixture \
            --shim target/debug/jefe-capture-shim \
            --reports target/tmux-scenarios/linux-${{ matrix.shard }}
      - name: Upload Linux scenario evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tui-scenarios-linux-${{ matrix.shard }}
          path: target/tmux-scenarios/linux-${{ matrix.shard }}
          if-no-files-found: error

  tui_scenarios_macos:
    name: Required schema-1 TUI scenarios (macOS shard ${{ matrix.shard }})
    runs-on: macos-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install tmux
        run: brew install tmux
      - name: Build schema-1 scenario authority
        run: >-
          cargo build --locked --all-features
          --bin jefe --bin jefe-harness-probe --bin jefe-capture-shim
          --bin jefe-jsp-llxprt-fixture --bin tmux_scenario
      - name: Execute exact required macOS scenario shard
        run: |
          python3 scripts/run-scenario-manifest.py \
            --platform macos \
            --shard-index ${{ matrix.shard }} \
            --shard-count 6 \
            --tmux-scenario target/debug/tmux_scenario \
            --jefe target/debug/jefe \
            --probe target/debug/jefe-harness-probe \
            --jsp-fixture target/debug/jefe-jsp-llxprt-fixture \
            --shim target/debug/jefe-capture-shim \
            --reports target/tmux-scenarios/macos-${{ matrix.shard }}
      - name: Upload macOS scenario evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tui-scenarios-macos-${{ matrix.shard }}
          path: target/tmux-scenarios/macos-${{ matrix.shard }}
          if-no-files-found: error

  tui_scenarios_complete:
    name: Required TUI scenario completion gate
    runs-on: ubuntu-latest
    needs: [test, tui_scenarios_linux, tui_scenarios_macos]
    if: always()
    steps:
      - uses: actions/checkout@v4
      - name: Download Linux scenario evidence
        uses: actions/download-artifact@v4
        with:
          pattern: tui-scenarios-linux-*
          path: target/tmux-scenarios/linux
      - name: Download macOS scenario evidence
        uses: actions/download-artifact@v4
        with:
          pattern: tui-scenarios-macos-*
          path: target/tmux-scenarios/macos
      - name: Require successful declared-platform shards
        env:
          TEST_RESULT: ${{ needs.test.result }}
          LINUX_RESULT: ${{ needs.tui_scenarios_linux.result }}
          MACOS_RESULT: ${{ needs.tui_scenarios_macos.result }}
        run: |
          test "$TEST_RESULT" = success
          test "$LINUX_RESULT" = success
          test "$MACOS_RESULT" = success
      - name: Verify exact Linux scenario union
        run: >-
          python3 scripts/run-scenario-manifest.py
          --platform linux
          --verify-completion target/tmux-scenarios/linux
          --expected-shards 2
      - name: Verify exact macOS scenario union
        run: >-
          python3 scripts/run-scenario-manifest.py
          --platform macos
          --verify-completion target/tmux-scenarios/macos
          --expected-shards 6


  windows_clippy:
    name: Windows Clippy (cfg(windows) lint gap)
    runs-on: windows-latest
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      CLIPPY_CONF_DIR: .github/clippy
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          target: x86_64-pc-windows-msvc
          components: clippy
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          cache-targets: false
          shared-key: windows-msvc-clippy
      # Ubuntu clippy cannot see cfg(windows) code, so this is genuine Windows
      # signal. It reports independently and never gates the native suite.
      - name: Run strict Clippy on Windows
        shell: pwsh
        run: |
          cargo clippy --workspace --all-targets --all-features -- -D warnings

  windows_coverage:
    name: Windows coverage floors
    runs-on: windows-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          target: x86_64-pc-windows-msvc
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          cache-targets: false
          shared-key: windows-msvc-coverage
      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov
      # The workspace coverage gate runs on Ubuntu, where every Windows-only
      # module is compiled out. This enforces a floor per Windows-only module
      # so a regression names the module instead of moving an average that
      # Windows-only code cannot move.
      - name: Enforce Windows-only module coverage floors
        shell: pwsh
        run: cargo xtask coverage-windows
      - name: Upload Windows coverage tracefile
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-coverage-run${{ github.run_id }}-attempt${{ github.run_attempt }}
          path: target/windows-coverage.lcov
          if-no-files-found: warn

  windows_native:
    name: Native Windows (MSVC + psmux)
    runs-on: windows-latest
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      JEFE_REQUIRE_PSMUX: "1"
      RUST_BACKTRACE: full
      PSMUX_VERSION: "3.3.7"
      PSMUX_SHA256: 60ff7b236f64184921cef3c1ff2611aa5a36fcc7ed8e2a58e968b8ded57f6028
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          target: x86_64-pc-windows-msvc
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          cache-targets: false
          shared-key: windows-msvc
      - name: Initialize Windows diagnostics
        shell: pwsh
        run: New-Item -ItemType Directory -Force target/windows-ci | Out-Null
      - name: Install pinned psmux
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $archiveName = "psmux-v$env:PSMUX_VERSION-windows-x64.zip"
          $url = "https://github.com/psmux/psmux/releases/download/v$env:PSMUX_VERSION/$archiveName"
          $expected = $env:PSMUX_SHA256
          $archive = Join-Path $env:RUNNER_TEMP $archiveName
          $install = Join-Path $env:RUNNER_TOOL_CACHE "psmux/$env:PSMUX_VERSION/x64"
          Invoke-WebRequest -Uri $url -OutFile $archive
          $actual = (Get-FileHash -Path $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $expected) {
            throw "psmux archive checksum mismatch: expected $expected, got $actual"
          }
          New-Item -ItemType Directory -Force $install | Out-Null
          Expand-Archive -Path $archive -DestinationPath $install -Force
          $executable = Get-ChildItem -Path $install -Filter psmux.exe -Recurse |
            Select-Object -First 1
          if ($null -eq $executable) {
            throw "psmux.exe was not present in the verified archive"
          }
          $executable.DirectoryName | Out-File -FilePath $env:GITHUB_PATH -Append
          "JEFE_PSMUX_BIN=$($executable.FullName)" |
            Out-File -FilePath $env:GITHUB_ENV -Append
      - name: Verify psmux version
        shell: pwsh
        run: |
          $version = & $env:JEFE_PSMUX_BIN -V 2>&1
          $status = $LASTEXITCODE
          $version | Tee-Object -FilePath target/windows-ci/psmux-version.txt
          if ($status -ne 0) {
            exit $status
          }
          $versionLine = $version |
            Where-Object { $_ -eq "tmux $env:PSMUX_VERSION" } |
            Select-Object -First 1
          if ($null -eq $versionLine) {
            $versionText = ($version | Out-String).Trim()
            throw "expected qualified psmux $env:PSMUX_VERSION, got: $versionText"
          }
      # Formatting, clippy-allow, source-size and architecture are platform
      # independent and already enforced by dedicated Ubuntu jobs above. They
      # used to run here, ahead of every native step, where a single failure
      # skipped the entire Windows suite: 7 of 15 windows_native failures over
      # 80 runs produced zero Windows signal for exactly this reason. Windows
      # clippy still runs, but as the independent windows_clippy job.
      - name: Build locked all-feature workspace
        shell: pwsh
        run: |
          cargo build --workspace --all-features --locked 2>&1 |
            Tee-Object -FilePath target/windows-ci/cargo-build.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Run installer Pester harness
        shell: powershell
        run: |
          Import-Module Pester -RequiredVersion 3.4.0
          $result = Invoke-Pester -Script tests/powershell/jefe-install.Tests.ps1 -PassThru
          if ($result.FailedCount -ne 0) {
            throw "installer Pester harness failed: $($result.FailedCount) test(s)"
          }
      # Runs at default parallelism. psmux tests isolate themselves with
      # per-test namespaces and per-test server lifetimes, so the races that
      # multi-agent users actually hit stay visible to CI.
      - name: Test locked all-feature workspace
        shell: pwsh
        run: |
          cargo test --workspace --all-features --locked 2>&1 |
            Tee-Object -FilePath target/windows-ci/cargo-test.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Clean package lifecycle (install, doctor, upgrade, uninstall)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $stage = Join-Path $env:RUNNER_TEMP 'jefe package stage'
          $archive = Join-Path $env:RUNNER_TEMP 'jefe-package.zip'
          $package = Join-Path $env:RUNNER_TEMP 'jefe package extracted'
          $installDir = Join-Path $env:RUNNER_TEMP 'jefe package install'
          New-Item -ItemType Directory -Force $stage | Out-Null

          Copy-Item 'target/debug/jefe.exe' (Join-Path $stage 'jefe.exe') -Force
          $binaryHash = (Get-FileHash -LiteralPath (Join-Path $stage 'jefe.exe') -Algorithm SHA256).Hash.ToLowerInvariant()
          "$binaryHash  jefe.exe" | Set-Content -LiteralPath (Join-Path $stage 'jefe.exe.sha256') -Encoding ascii
          Copy-Item 'LICENSE' (Join-Path $stage 'LICENSE') -Force
          Copy-Item 'scripts/jefe-install.ps1' (Join-Path $stage 'jefe-install.ps1') -Force
          Compress-Archive -Path (Join-Path $stage '*') -DestinationPath $archive -Force
          Expand-Archive -Path $archive -DestinationPath $package -Force

          $packageFiles = @(Get-ChildItem -LiteralPath $package -File | Sort-Object Name | ForEach-Object Name)
          if (($packageFiles -join ',') -ne 'jefe-install.ps1,jefe.exe,jefe.exe.sha256,LICENSE') {
            throw "unexpected package contents: $($packageFiles -join ', ')"
          }
          if (Get-Command jefe -ErrorAction SilentlyContinue) {
            throw 'jefe must not be preinstalled on the clean package runner'
          }

          $installedExe = Join-Path $installDir 'jefe.exe'
          $installer = Join-Path $package 'jefe-install.ps1'
          & $installer -Action Install -SourceDir $package -InstallDir $installDir 2>&1 |
            Tee-Object -FilePath target/windows-ci/package-install.log
          if (-not (Test-Path $installedExe)) { throw 'jefe.exe was not installed' }
          if (-not (Test-Path (Join-Path $installDir '.jefe-installed'))) {
            throw 'ownership marker was not written'
          }

          & $installedExe --version 2>&1 |
            Tee-Object -FilePath target/windows-ci/installed-version.log
          if ($LASTEXITCODE -ne 0) { throw 'installed jefe --version failed' }

          $doctorConfig = Join-Path $env:RUNNER_TEMP 'jefe package doctor config'
          New-Item -ItemType Directory -Force $doctorConfig | Out-Null
          & $installedExe doctor --config $doctorConfig 2>&1 |
            Tee-Object -FilePath target/windows-ci/installed-doctor.log
          if ($LASTEXITCODE -ne 0) { throw "installed jefe doctor exited with $LASTEXITCODE" }

          $sentinelDir = Join-Path $env:LOCALAPPDATA 'jefe'
          $sentinel = Join-Path $sentinelDir 'package-lifecycle-sentinel'
          New-Item -ItemType Directory -Force $sentinelDir | Out-Null
          'sentinel' | Set-Content -Path $sentinel -Encoding UTF8

          & $installer -Action Upgrade -SourceDir $package -InstallDir $installDir 2>&1 |
            Tee-Object -FilePath target/windows-ci/package-upgrade.log
          if ($LASTEXITCODE -ne 0) { throw "upgrade failed with exit $LASTEXITCODE" }

          & $installer -Action Uninstall -SourceDir $package -InstallDir $installDir 2>&1 |
            Tee-Object -FilePath target/windows-ci/package-uninstall.log
          if (Test-Path $installDir) { throw 'package-owned install dir survived uninstall' }
          $userPath = [Environment]::GetEnvironmentVariable('Path', 'User')
          if ($userPath -and ($userPath -split ';') -contains $installDir) {
            throw 'install dir survived in user PATH'
          }
          if (-not (Test-Path $sentinel)) {
            throw 'config sentinel was removed by uninstall'
          }
          Remove-Item -Path $sentinel -Force
      - name: Run real psmux startup-quit against installed binary
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $package = Join-Path $env:RUNNER_TEMP 'jefe package extracted'
          $installDir = Join-Path $env:RUNNER_TEMP 'jefe package install'
          $installer = Join-Path $package 'jefe-install.ps1'
          & $installer -Action Install -SourceDir $package -InstallDir $installDir 2>&1 |
            Tee-Object -FilePath target/windows-ci/psmux-install.log
          $installedJefe = Join-Path $installDir 'jefe.exe'
          $config = Join-Path $env:RUNNER_TEMP 'jefe installed psmux config'
          $working = Join-Path $env:RUNNER_TEMP 'jefe installed psmux working'
          $namespace = "jefe-pkg-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          New-Item -ItemType Directory -Force $config, $working | Out-Null
          $env:JEFE_CONFIG_DIR = $config
          $env:JEFE_PSMUX_NAMESPACE = $namespace
          $session = 'installed-smoke'
          try {
            & $env:JEFE_PSMUX_BIN -f NUL -L $namespace new-session -d -s $session -c $working $installedJefe
            if ($LASTEXITCODE -ne 0) { throw "failed to start installed Jefe in psmux" }
            $ready = $false
            for ($attempt = 0; $attempt -lt 60; $attempt++) {
              $sessions = & $env:JEFE_PSMUX_BIN -f NUL -L $namespace list-sessions -F '#S' 2>$null
              if (($LASTEXITCODE -eq 0) -and ($sessions -contains $session)) {
                $frame = & $env:JEFE_PSMUX_BIN -f NUL -L $namespace capture-pane -p -t "$session`:0.0" 2>$null
                $frameText = $frame -join "`n"
                $frameOk = ($LASTEXITCODE -eq 0) -and
                  ($frameText -match 'LLxprt Jefe') -and
                  ($frameText -match 'Green Screen') -and
                  ($frameText -match '╮')
                $viewport = & $env:JEFE_PSMUX_BIN -f NUL -L $namespace display-message -p -t "$session`:0.0" '#{pane_width}x#{pane_height}' 2>$null
                $viewportOk = ($LASTEXITCODE -eq 0) -and ($viewport -match '^\d+x\d+$')
                if ($frameOk -and $viewportOk) {
                  $ready = $true
                  $frame | Tee-Object -FilePath target/windows-ci/installed-startup-frame.txt
                  $viewport | Tee-Object -FilePath target/windows-ci/installed-startup-viewport.txt
                  break
                }
              }
              Start-Sleep -Milliseconds 250
            }
            if (-not $ready) { throw "installed Jefe session did not become ready" }

            & $env:JEFE_PSMUX_BIN -f NUL -L $namespace send-keys -t "$session`:0.0" N
            if ($LASTEXITCODE -ne 0) { throw "failed to open New Repository" }
            $transitioned = $false
            for ($attempt = 0; $attempt -lt 60; $attempt++) {
              $newRepositoryFrame = & $env:JEFE_PSMUX_BIN -f NUL -L $namespace capture-pane -p -t "$session`:0.0" 2>$null
              $newRepositoryText = $newRepositoryFrame -join "`n"
              if (($LASTEXITCODE -eq 0) -and
                  ($newRepositoryText -match 'New Repository') -and
                  ($newRepositoryText -match '╮')) {
                $transitioned = $true
                $newRepositoryFrame | Tee-Object -FilePath target/windows-ci/installed-new-repository-frame.txt
                break
              }
              Start-Sleep -Milliseconds 250
            }
            if (-not $transitioned) { throw "installed Jefe did not render New Repository with its right border" }

            & $env:JEFE_PSMUX_BIN -f NUL -L $namespace send-keys -t "$session`:0.0" Escape
            if ($LASTEXITCODE -ne 0) { throw "failed to close New Repository" }
            $restored = $false
            for ($attempt = 0; $attempt -lt 60; $attempt++) {
              $restoredFrame = & $env:JEFE_PSMUX_BIN -f NUL -L $namespace capture-pane -p -t "$session`:0.0" 2>$null
              $restoredText = $restoredFrame -join "`n"
              if (($LASTEXITCODE -eq 0) -and
                  ($restoredText -match 'LLxprt Jefe') -and
                  ($restoredText -match 'Green Screen') -and
                  ($restoredText -match '╮') -and
                  ($restoredText -notmatch 'New Repository')) {
                $restored = $true
                $restoredFrame | Tee-Object -FilePath target/windows-ci/installed-restored-frame.txt
                break
              }
              Start-Sleep -Milliseconds 250
            }
            if (-not $restored) { throw "installed Jefe did not restore its bordered dashboard after Escape" }

            & $env:JEFE_PSMUX_BIN -f NUL -L $namespace send-keys -t "$session`:0.0" C-q
            if ($LASTEXITCODE -ne 0) { throw "failed to send Ctrl+Q to installed Jefe" }
            $stopped = $false
            for ($attempt = 0; $attempt -lt 60; $attempt++) {
              $sessions = & $env:JEFE_PSMUX_BIN -f NUL -L $namespace list-sessions -F '#S' 2>$null
              if (($LASTEXITCODE -ne 0) -or ($sessions -notcontains $session)) {
                $stopped = $true
                break
              }
              Start-Sleep -Milliseconds 250
            }
            if (-not $stopped) { throw "installed Jefe psmux session survived Ctrl+Q" }
          }
          finally {
            & $env:JEFE_PSMUX_BIN -f NUL -L $namespace kill-session -t $session 2>$null
            & $env:JEFE_PSMUX_BIN -f NUL -L $namespace kill-server 2>$null
          }
          & $installer -Action Uninstall -SourceDir $package -InstallDir $installDir 2>&1 |
            Tee-Object -FilePath target/windows-ci/psmux-uninstall.log
          if ($LASTEXITCODE -ne 0) { throw "installed jefe uninstall failed with exit $LASTEXITCODE" }
          if (Test-Path $installDir) { throw 'installed jefe install dir survived uninstall' }
          $remaining = & $env:JEFE_PSMUX_BIN -f NUL -L $namespace list-sessions 2>&1
          if (($LASTEXITCODE -eq 0) -and $remaining) {
            throw "orphaned psmux sessions remain after uninstall: $remaining"
          }
      - name: Clean package lifecycle residue
        if: always()
        continue-on-error: true
        shell: pwsh
        run: |
          $package = Join-Path $env:RUNNER_TEMP 'jefe package extracted'
          $installDir = Join-Path $env:RUNNER_TEMP 'jefe package install'
          $installer = Join-Path $package 'jefe-install.ps1'
          if ((Test-Path $installer) -and (Test-Path (Join-Path $installDir '.jefe-installed'))) {
            & $installer -Action Uninstall -SourceDir $package -InstallDir $installDir
          }
      # Issue #542 (V7). The step above records and exits 0, so the orphaned
      # tree class this repository has reopened four times could never turn CI
      # red. Sessions are also the wrong unit: #515's signature is a session
      # that has already left the inventory while its session host and worker
      # keep running. Per dev-docs/standards/windows-session-ownership.md the
      # session host is the anchor holder, so zero surviving session hosts
      # means zero surviving trees -- the Job Object reaps the worker when the
      # host exits.
      - name: Assert no jefe process survives the suite
        if: always()
        shell: pwsh
        run: |
          $survivors = @(Get-Process -ErrorAction SilentlyContinue |
            Where-Object { $_.ProcessName -like 'jefe-session-host*' })
          $report = 'target/windows-ci/surviving-processes.txt'
          New-Item -ItemType Directory -Force -Path 'target/windows-ci' | Out-Null
          if ($survivors.Count -eq 0) {
            'No jefe session host survived the suite.' | Out-File $report
            return
          }
          $survivors |
            Select-Object Id, ProcessName, StartTime, Path |
            Format-List |
            Out-File $report
          Get-Content $report | Write-Host
          throw "$($survivors.Count) jefe session host process(es) survived the suite. Every session host must be reaped when its owner dies; see dev-docs/standards/windows-session-ownership.md."
      - name: Upload native Windows diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: native-windows-psmux-artifacts-run${{ github.run_id }}-attempt${{ github.run_attempt }}
          path: |
            target/windows-ci
            target/psmux-smoke
          if-no-files-found: warn

  windows_native_complete:
    name: Native Windows completion gate
    runs-on: ubuntu-latest
    needs: [windows_native]
    # Must evaluate even when windows_native fails, is cancelled, or is
    # skipped. Without always() this gate would itself be skipped and would
    # prove nothing.
    if: always()
    permissions:
      contents: read
    steps:
      # A windows_native result of "skipped" is not a pass. Branch protection
      # should require THIS check, so that a PR cannot merge on Windows
      # validation that never ran.
      - name: Reject skipped or unsuccessful native Windows validation
        shell: bash
        run: |
          set -euo pipefail
          result='${{ needs.windows_native.result }}'
          echo "windows_native result: ${result}"
          case "${result}" in
            success)
              echo "Native Windows validation executed and passed."
              ;;
            skipped)
              echo "::error::windows_native was skipped. A green-because-skipped result is not Windows signal."
              exit 1
              ;;
            *)
              echo "::error::windows_native reported '${result}'. Native Windows validation did not pass."
              exit 1
              ;;
          esac

  flake_baseline:
    name: Main flake baseline record
    runs-on: ubuntu-latest
    needs:
      [
        test,
        tui_scenarios_linux,
        tui_scenarios_macos,
        tui_scenarios_complete,
        windows_clippy,
        windows_coverage,
        windows_native,
        windows_native_complete,
      ]
    if: ${{ always() && github.event_name == 'schedule' }}
    permissions:
      contents: read
    steps:
      # Attribution, not argument: every scheduled run leaves a retrievable
      # record of which gate was red, so intermittent failures can be counted.
      - name: Record scheduled run outcome
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p flake-baseline
          cat > "flake-baseline/run-${{ github.run_id }}.json" <<'RECORD'
          {
            "run_id": "${{ github.run_id }}",
            "run_attempt": "${{ github.run_attempt }}",
            "commit": "${{ github.sha }}",
            "started": "${{ github.event.repository.updated_at }}",
            "results": {
              "test": "${{ needs.test.result }}",
              "tui_scenarios_linux": "${{ needs.tui_scenarios_linux.result }}",
              "tui_scenarios_macos": "${{ needs.tui_scenarios_macos.result }}",
              "tui_scenarios_complete": "${{ needs.tui_scenarios_complete.result }}",
              "windows_clippy": "${{ needs.windows_clippy.result }}",
              "windows_coverage": "${{ needs.windows_coverage.result }}",
              "windows_native": "${{ needs.windows_native.result }}",
              "windows_native_complete": "${{ needs.windows_native_complete.result }}"
            }
          }
          RECORD
          cat "flake-baseline/run-${{ github.run_id }}.json"
      - name: Upload flake baseline record
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: flake-baseline-run${{ github.run_id }}-attempt${{ github.run_attempt }}
          path: flake-baseline
          retention-days: 90
          if-no-files-found: error