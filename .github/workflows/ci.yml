name: CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      run_tui_smoke:
        description: Run optional tmux-backed TUI smoke scenario
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: Format (rustfmt)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Check formatting
        run: cargo fmt --all --check

  lint:
    name: Lint (clippy)
    runs-on: ubuntu-latest
    env:
      CLIPPY_CONF_DIR: .github/clippy
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Run clippy (warnings as errors)
        run: rustup run stable cargo clippy --workspace --all-targets --all-features -- -D warnings

  clippy_allow_policy:
    name: Clippy allow policy
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - name: Block untracked clippy allow attributes
        run: scripts/check-clippy-allows.sh

  source_file_size:
    name: Source file length checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Enforce source file length policy
        run: scripts/check-source-file-size.sh

  complexity:
    name: Complexity checks
    runs-on: ubuntu-latest
    env:
      CLIPPY_CONF_DIR: .github/clippy
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Enforce complexity limits
        run: |
          rustup run stable cargo clippy --workspace --all-targets --all-features -- \
            -A clippy::all \
            -A clippy::pedantic \
            -A clippy::nursery \
            -D clippy::cognitive_complexity \
            -D clippy::too_many_lines \
            -D clippy::too_many_arguments \
            -D clippy::type_complexity \
            -D clippy::struct_excessive_bools

  coverage:
    name: Coverage gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov
      - name: Enforce line coverage threshold
        run: |
          RUSTC_BIN="$(rustup which --toolchain stable rustc)"
          TOOLCHAIN_DIR="$(dirname "$(dirname "$RUSTC_BIN")")"
          HOST_TRIPLE="$(rustup run stable rustc -vV | sed -n 's/^host: //p')"
          LLVM_COV="$TOOLCHAIN_DIR/lib/rustlib/$HOST_TRIPLE/bin/llvm-cov" \
          LLVM_PROFDATA="$TOOLCHAIN_DIR/lib/rustlib/$HOST_TRIPLE/bin/llvm-profdata" \
          rustup run stable cargo llvm-cov \
            --workspace \
            --all-features \
            --summary-only \
            --ignore-filename-regex '(/vendor/|/tmp/|/rustc-)' \
            --fail-under-lines 30

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [fmt, lint, clippy_allow_policy, source_file_size, complexity, coverage]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Check formatting
        run: cargo fmt --all --check
      - name: Build workspace
        run: cargo build --workspace --all-features --locked

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Run tests
        run: cargo test --workspace --all-features --locked

  windows_native:
    name: Native Windows (MSVC + psmux)
    runs-on: windows-latest
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      CLIPPY_CONF_DIR: .github/clippy
      JEFE_REQUIRE_PSMUX: "1"
      RUST_BACKTRACE: full
      RUST_TEST_THREADS: "1"
      PSMUX_VERSION: "3.3.6"
      PSMUX_SHA256: a56a890ea0829567818b9a368f16dcbd39c087f27328573df17c10dd39618947
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          target: x86_64-pc-windows-msvc
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          cache-targets: false
          shared-key: windows-msvc
      - name: Initialize Windows diagnostics
        shell: pwsh
        run: New-Item -ItemType Directory -Force target/windows-ci | Out-Null
      - name: Install pinned psmux
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $archiveName = "psmux-v$env:PSMUX_VERSION-windows-x64.zip"
          $url = "https://github.com/psmux/psmux/releases/download/v$env:PSMUX_VERSION/$archiveName"
          $expected = $env:PSMUX_SHA256
          $archive = Join-Path $env:RUNNER_TEMP $archiveName
          $install = Join-Path $env:RUNNER_TOOL_CACHE "psmux/$env:PSMUX_VERSION/x64"
          Invoke-WebRequest -Uri $url -OutFile $archive
          $actual = (Get-FileHash -Path $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $expected) {
            throw "psmux archive checksum mismatch: expected $expected, got $actual"
          }
          New-Item -ItemType Directory -Force $install | Out-Null
          Expand-Archive -Path $archive -DestinationPath $install -Force
          $executable = Get-ChildItem -Path $install -Filter psmux.exe -Recurse |
            Select-Object -First 1
          if ($null -eq $executable) {
            throw "psmux.exe was not present in the verified archive"
          }
          $executable.DirectoryName | Out-File -FilePath $env:GITHUB_PATH -Append
          "JEFE_PSMUX_BIN=$($executable.FullName)" |
            Out-File -FilePath $env:GITHUB_ENV -Append
      - name: Verify psmux version
        shell: pwsh
        run: |
          $version = & $env:JEFE_PSMUX_BIN -V 2>&1
          $status = $LASTEXITCODE
          $version | Tee-Object -FilePath target/windows-ci/psmux-version.txt
          if ($status -ne 0) {
            exit $status
          }
          $versionText = ($version | Out-String).Trim()
          if ($versionText -ne "tmux $env:PSMUX_VERSION") {
            throw "expected qualified psmux $env:PSMUX_VERSION, got: $versionText"
          }
      - name: Check formatting
        shell: pwsh
        run: |
          cargo fmt --all --check 2>&1 |
            Tee-Object -FilePath target/windows-ci/cargo-fmt.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Run strict Clippy
        shell: pwsh
        run: |
          cargo clippy --workspace --all-targets --all-features -- -D warnings 2>&1 |
            Tee-Object -FilePath target/windows-ci/cargo-clippy.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build locked all-feature workspace
        shell: pwsh
        run: |
          cargo build --workspace --all-features --locked 2>&1 |
            Tee-Object -FilePath target/windows-ci/cargo-build.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Test locked all-feature workspace
        shell: pwsh
        run: |
          cargo test --workspace --all-features --locked -- --test-threads=1 2>&1 |
            Tee-Object -FilePath target/windows-ci/cargo-test.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Run real psmux command-surface smoke suite
        shell: pwsh
        run: |
          cargo test --features psmux-smoke --test psmux_smoke -- --nocapture --test-threads=1 2>&1 |
            Tee-Object -FilePath target/windows-ci/psmux-smoke.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Run deterministic startup and quit TUI scenario
        shell: pwsh
        run: |
          $config = Join-Path $env:RUNNER_TEMP 'jefe windows ci config'
          $working = Join-Path $env:RUNNER_TEMP 'jefe windows ci working directory'
          $artifacts = Join-Path $env:GITHUB_WORKSPACE 'target/tmux-harness/windows-startup'
          New-Item -ItemType Directory -Force $config, $working, $artifacts | Out-Null
          $harness = Join-Path $env:GITHUB_WORKSPACE 'target/debug/jefe-tmux-harness.exe'
          $jefe = Join-Path $env:GITHUB_WORKSPACE 'target/debug/jefe.exe'
          & $harness `
            --scenario dev-docs/tmux-scenarios/startup-quit.json `
            --jefe-bin $jefe `
            --config $config `
            --working-dir $working `
            --session "jefe-ci-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT" `
            --out-dir $artifacts 2>&1 |
            Tee-Object -FilePath target/windows-ci/tui-startup.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify renderer viewport edges without full redraws
        shell: pwsh
        run: |
          $config = Join-Path $env:RUNNER_TEMP 'jefe renderer config'
          $working = Join-Path $env:RUNNER_TEMP 'jefe renderer working directory'
          $artifacts = Join-Path $env:GITHUB_WORKSPACE 'target/tmux-harness/windows-renderer'
          New-Item -ItemType Directory -Force $config, $working, $artifacts | Out-Null
          $harness = Join-Path $env:GITHUB_WORKSPACE 'target/debug/jefe-tmux-harness.exe'
          $jefe = Join-Path $env:GITHUB_WORKSPACE 'target/debug/jefe.exe'
          & $harness `
            --scenario dev-docs/tmux-scenarios/windows-renderer-viewport.json `
            --jefe-bin $jefe `
            --config $config `
            --working-dir $working `
            --session "jefe-renderer-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT" `
            --out-dir $artifacts 2>&1 |
            Tee-Object -FilePath target/windows-ci/tui-renderer.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Clean package lifecycle (install, doctor, upgrade, uninstall)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $stage = Join-Path $env:RUNNER_TEMP 'jefe package stage'
          $archive = Join-Path $env:RUNNER_TEMP 'jefe-package.zip'
          $package = Join-Path $env:RUNNER_TEMP 'jefe package extracted'
          $installDir = Join-Path $env:RUNNER_TEMP 'jefe package install'
          New-Item -ItemType Directory -Force $stage | Out-Null

          Copy-Item 'target/debug/jefe.exe' (Join-Path $stage 'jefe.exe') -Force
          Copy-Item 'LICENSE' (Join-Path $stage 'LICENSE') -Force
          Copy-Item 'scripts/jefe-install.ps1' (Join-Path $stage 'jefe-install.ps1') -Force
          Compress-Archive -Path (Join-Path $stage '*') -DestinationPath $archive -Force
          Expand-Archive -Path $archive -DestinationPath $package -Force

          $packageFiles = @(Get-ChildItem -LiteralPath $package -File | Sort-Object Name | ForEach-Object Name)
          if (($packageFiles -join ',') -ne 'jefe-install.ps1,jefe.exe,LICENSE') {
            throw "unexpected package contents: $($packageFiles -join ', ')"
          }
          if (Get-Command jefe -ErrorAction SilentlyContinue) {
            throw 'jefe must not be preinstalled on the clean package runner'
          }

          $installedExe = Join-Path $installDir 'jefe.exe'
          $installer = Join-Path $package 'jefe-install.ps1'
          & $installer -Action Install -SourceDir $package -InstallDir $installDir 2>&1 |
            Tee-Object -FilePath target/windows-ci/package-install.log
          if (-not (Test-Path $installedExe)) { throw 'jefe.exe was not installed' }
          if (-not (Test-Path (Join-Path $installDir '.jefe-installed'))) {
            throw 'ownership marker was not written'
          }

          & $installedExe --version 2>&1 |
            Tee-Object -FilePath target/windows-ci/installed-version.log
          if ($LASTEXITCODE -ne 0) { throw 'installed jefe --version failed' }

          $doctorConfig = Join-Path $env:RUNNER_TEMP 'jefe package doctor config'
          New-Item -ItemType Directory -Force $doctorConfig | Out-Null
          & $installedExe doctor --config $doctorConfig 2>&1 |
            Tee-Object -FilePath target/windows-ci/installed-doctor.log
          if ($LASTEXITCODE -ne 0) { throw "installed jefe doctor exited with $LASTEXITCODE" }

          $sentinelDir = Join-Path $env:LOCALAPPDATA 'jefe'
          $sentinel = Join-Path $sentinelDir 'package-lifecycle-sentinel'
          New-Item -ItemType Directory -Force $sentinelDir | Out-Null
          'sentinel' | Set-Content -Path $sentinel -Encoding UTF8

          & $installer -Action Upgrade -SourceDir $package -InstallDir $installDir 2>&1 |
            Tee-Object -FilePath target/windows-ci/package-upgrade.log
          if ($LASTEXITCODE -ne 0) { throw "upgrade failed with exit $LASTEXITCODE" }

          & $installer -Action Uninstall -SourceDir $package -InstallDir $installDir 2>&1 |
            Tee-Object -FilePath target/windows-ci/package-uninstall.log
          if (Test-Path $installDir) { throw 'package-owned install dir survived uninstall' }
          $userPath = [Environment]::GetEnvironmentVariable('Path', 'User')
          if ($userPath -and ($userPath -split ';') -contains $installDir) {
            throw 'install dir survived in user PATH'
          }
          if (-not (Test-Path $sentinel)) {
            throw 'config sentinel was removed by uninstall'
          }
          Remove-Item -Path $sentinel -Force
      - name: Run real psmux startup-quit against installed binary
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $package = Join-Path $env:RUNNER_TEMP 'jefe package extracted'
          $installDir = Join-Path $env:RUNNER_TEMP 'jefe package install'
          $installer = Join-Path $package 'jefe-install.ps1'
          & $installer -Action Install -SourceDir $package -InstallDir $installDir 2>&1 |
            Tee-Object -FilePath target/windows-ci/psmux-install.log
          $config = Join-Path $env:RUNNER_TEMP 'jefe installed psmux config'
          $working = Join-Path $env:RUNNER_TEMP 'jefe installed psmux working'
          $artifacts = Join-Path $env:GITHUB_WORKSPACE 'target/tmux-harness/windows-installed-startup'
          New-Item -ItemType Directory -Force $config, $working, $artifacts | Out-Null
          $harness = Join-Path $env:GITHUB_WORKSPACE 'target/debug/jefe-tmux-harness.exe'
          $installedJefe = Join-Path $installDir 'jefe.exe'
          $namespace = "jefe-pkg-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          & $harness `
            --scenario dev-docs/tmux-scenarios/startup-quit.json `
            --jefe-bin $installedJefe `
            --config $config `
            --working-dir $working `
            --session $namespace `
            --out-dir $artifacts 2>&1 |
            Tee-Object -FilePath target/windows-ci/installed-psmux-startup.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $installer -Action Uninstall -SourceDir $package -InstallDir $installDir 2>&1 |
            Tee-Object -FilePath target/windows-ci/psmux-uninstall.log
          if ($LASTEXITCODE -ne 0) { throw "installed jefe uninstall failed with exit $LASTEXITCODE" }
          if (Test-Path $installDir) { throw 'installed jefe install dir survived uninstall' }
          # Verify no psmux sessions from this package's namespace survive uninstall.
          if (Test-Path -LiteralPath env:JEFE_PSMUX_BIN) {
            $remaining = & $env:JEFE_PSMUX_BIN -f NUL -L $namespace list-sessions 2>&1
            if (($LASTEXITCODE -eq 0) -and $remaining) {
              throw "orphaned psmux sessions remain after uninstall: $remaining"
            }
          }
      - name: Clean package lifecycle residue
        if: always()
        continue-on-error: true
        shell: pwsh
        run: |
          $package = Join-Path $env:RUNNER_TEMP 'jefe package extracted'
          $installDir = Join-Path $env:RUNNER_TEMP 'jefe package install'
          $installer = Join-Path $package 'jefe-install.ps1'
          if ((Test-Path $installer) -and (Test-Path (Join-Path $installDir '.jefe-installed'))) {
            & $installer -Action Uninstall -SourceDir $package -InstallDir $installDir
          }
      - name: Record remaining owned psmux sessions
        if: always()
        continue-on-error: true
        shell: pwsh
        run: |
          $remaining = 'target/windows-ci/remaining-sessions.txt'
          $recordedNamespace = $false
          $detailsFiles = @(
            'target/tmux-harness/windows-startup/multiplexer.txt',
            'target/tmux-harness/windows-renderer/multiplexer.txt',
            'target/tmux-harness/windows-installed-startup/multiplexer.txt'
          )
          foreach ($details in $detailsFiles) {
            if (Test-Path $details) {
              $match = Select-String -Path $details -Pattern '^namespace: (.+)$'
              if ($null -ne $match) {
                $recordedNamespace = $true
                $namespace = $match.Matches[0].Groups[1].Value
                $output = & $env:JEFE_PSMUX_BIN -f NUL -L $namespace list-sessions 2>&1
                $status = $LASTEXITCODE
                @("namespace: $namespace", "status: $status") + $output |
                  Out-File $remaining -Append
              }
            }
          }
          if (-not $recordedNamespace) {
            'No harness namespace was recorded.' | Out-File $remaining
          }
          exit 0
      - name: Upload native Windows diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: native-windows-psmux-artifacts-run${{ github.run_id }}-attempt${{ github.run_attempt }}
          path: |
            target/windows-ci
            target/psmux-smoke
            target/tmux-harness
          if-no-files-found: warn

  tui_smoke:
    name: Optional TUI smoke (tmux)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_tui_smoke == 'true' }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install tmux
        shell: bash
        run: |
          set -euo pipefail
          if ! { sudo apt-get update && sudo apt-get install -y tmux; }; then
            echo "WARNING: tmux installation failed; smoke scenario will be skipped"
          fi
      - name: Run startup TUI smoke scenario
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v tmux >/dev/null 2>&1; then
            echo "tmux unavailable after install attempt; skipping optional TUI smoke"
            exit 0
          fi
          cargo build --locked --all-features --bin jefe --bin jefe-tmux-harness
          config_dir="$(mktemp -d)"
          mkdir -p target/tmux-harness/ci-startup
          target/debug/jefe-tmux-harness \
            --scenario dev-docs/tmux-scenarios/startup-quit.json \
            --jefe-bin target/debug/jefe \
            --config "$config_dir" \
            --out-dir target/tmux-harness/ci-startup
      - name: Upload TUI smoke artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tui-smoke-artifacts
          path: target/tmux-harness
          if-no-files-found: ignore
